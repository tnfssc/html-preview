name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run compile
      - run: pnpm test
      - run: pnpm run test:e2e
      - name: Build stable archive
        run: pnpm run zip
      - name: Install exact stable archive
        run: |
          rm -rf .artifact-extension
          mkdir .artifact-extension
          unzip -q .output/github-html-preview-*-chrome.zip -d .artifact-extension
      - name: Smoke exact stable archive
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.artifact-extension
        run: pnpm exec playwright test --grep "blob preview embeds"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Upload stable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-stable-archive
          path: .output/*-chrome.zip
          retention-days: 7

  debug-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run zip:debug
      - name: Install exact debug archive
        run: |
          rm -rf .artifact-extension-debug
          mkdir .artifact-extension-debug
          unzip -q .output/github-html-preview-*-chrome.zip -d .artifact-extension-debug
      - name: Smoke exact debug archive
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.artifact-extension-debug
        run: pnpm exec playwright test --grep "blob preview embeds"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-debug-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Upload debug archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-debug-archive
          path: .output/*-chrome.zip
          retention-days: 7
