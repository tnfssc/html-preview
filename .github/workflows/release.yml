name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check
        run: pnpm run compile

      - name: Run unit and manifest contracts
        run: pnpm test

      - name: Run deterministic extension E2E
        run: pnpm run test:e2e

      - name: Verify release version contract
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Build stable release archive
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm run zip

      - name: Build diagnostic prerelease archive
        if: ${{ contains(github.ref_name, '-debug.') }}
        run: |
          pnpm run zip:debug
          mv .output/github-html-preview-*-chrome.zip \
            ".output/github-html-preview-${GITHUB_REF_NAME#v}-chrome.zip"

      - name: Install exact release archive
        run: |
          rm -rf .artifact-extension
          mkdir .artifact-extension
          unzip -q .output/*-chrome.zip -d .artifact-extension

      - name: Smoke exact release archive
        env:
          EXTENSION_PATH: ${{ github.workspace }}/.artifact-extension
        run: pnpm exec playwright test --grep "blob preview embeds"

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Publish stable GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*-chrome.zip
          --verify-tag
          --generate-notes
          --title "GitHub HTML Preview $GITHUB_REF_NAME"

      - name: Publish diagnostic GitHub prerelease
        if: ${{ contains(github.ref_name, '-debug.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*-chrome.zip
          --verify-tag
          --prerelease
          --generate-notes
          --title "GitHub HTML Preview $GITHUB_REF_NAME"
          --notes-file .github/release-notes-debug.md
